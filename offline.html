<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00685d">
  <title>테니스 봄 · 오프라인</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f5f5f7; color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    main { width: min(320px, calc(100vw - 32px)); text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 20px 0 8px; font-size: 20px; }
    p { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #6e6e73; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 12px;
      background: #00685d; color: #fff; font: inherit; font-size: 15px; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <img src="./assets/logo-192.webp" alt="">
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요. 일정은 연결되면 바로 불러와요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
