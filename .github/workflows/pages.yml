name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Verify member access and cache isolation
        run: npm test

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html v2-data.js v2-admin.js _site/
          cp -R club _site/
          cp manifest.webmanifest _site/
          sed "s/__CACHE_VERSION__/${GITHUB_SHA::7}/g" sw.js > _site/sw.js
          cp -R assets _site/
          cp env.js _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
