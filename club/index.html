<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00685d">
  <meta name="color-scheme" content="light">
  <title>아직도 성장중 · 클럽 일정</title>
  <meta name="description" content="아직도 성장중 테니스 클럽의 경기 일정을 확인하는 읽기 전용 페이지입니다.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="아직도 성장중 · 클럽 일정">
  <meta property="og:description" content="날짜, 코트와 참석자를 한눈에 확인하세요. 읽기 전용 페이지입니다.">
  <meta property="og:url" content="https://cafesowoo.github.io/tennis-homepage-v2/club/">
  <meta property="og:image" content="https://cafesowoo.github.io/tennis-homepage-v2/assets/club-og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="아직도 성장중 · 클럽 일정">
  <meta name="twitter:description" content="날짜, 코트와 참석자를 한눈에 확인하세요. 읽기 전용 페이지입니다.">
  <meta name="twitter:image" content="https://cafesowoo.github.io/tennis-homepage-v2/assets/club-og.png">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="../env.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">일정으로 바로가기</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="아직도 성장중 클럽 일정 홈">
        <img class="brand-logo" src="../assets/logo.png" alt="">
        <span class="brand-copy">
          <img class="brand-wordmark" src="../assets/brand-wordmark.svg" alt="아직도 성장중">
          <span>Tennis Club Schedule</span>
        </span>
      </a>
      <div class="header-actions">
        <span class="readonly-badge"><span aria-hidden="true">●</span> 읽기 전용</span>
        <div class="sync-note" role="status">
          <span class="sync-dot" aria-hidden="true"></span>
          <span id="syncLabel">관리자 일정과 동기화됨</span>
        </div>
        <button class="icon-button" id="sharePageButton" type="button" aria-label="클럽 일정 페이지 공유">
          <span class="share-glyph" aria-hidden="true">↗</span>
        </button>
      </div>
    </div>
  </header>

  <main id="mainContent" class="page-shell">
    <section class="intro" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">MEMBER BOARD</p>
        <h1 id="pageTitle">우리 클럽 일정</h1>
        <p class="intro-copy">비 주기적으로 업데이트 됩니다. (매일 점심)</p>
      </div>
    </section>

    <div class="calendar-section-wrapper">
      <section class="calendar-card" aria-labelledby="calendarMonthTitle">
        <div class="calendar-toolbar">
          <h2 id="calendarMonthTitle">Aug. 2026</h2>
          <div class="calendar-controls">
            <button class="calendar-nav-button" id="previousMonthButton" type="button" aria-label="이전 달">
              <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
            </button>
            <button class="calendar-nav-button" id="nextMonthButton" type="button" aria-label="다음 달">
              <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
            </button>
          </div>
        </div>
        <div class="weekday-grid" aria-hidden="true">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="calendarGrid" class="calendar-grid" role="grid" aria-labelledby="calendarMonthTitle"></div>
      </section>

      <section id="selectedDatePanel" class="selected-date-panel" aria-labelledby="selectedDateTitle" hidden>
        <div class="selected-date-header">
          <h2 id="selectedDateTitle">선택한 날짜</h2>
          <button class="panel-close-button" id="closeSelectedDateButton" type="button" aria-label="선택한 날짜 일정 닫기">
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
          </button>
        </div>
        <div class="selected-date-list" id="selectedDateList" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <img src="../assets/logo.png" alt="" aria-hidden="true">
    <p><strong>아직도 성장중</strong><br><span>클럽 일정 조회 전용 페이지</span></p>
  </footer>
</body>
</html>
